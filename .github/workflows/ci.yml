# CI gates for eshu-collector-package-registry.
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below):
# this file holds the paths-filter `changes` job, the `go-ci` call with
# this repo's run-gate wiring, and the two caller-side jobs the reusable
# cannot own (weekly findings issue, SARIF upload). Lane bodies
# (lint/test/race/shell/image/boundary/govulncheck/gosec/actionlint and
# the ci-complete aggregator) live upstream; check runs nest as
# `go-ci / <lane>`, so the ruleset requires `go-ci / ci-complete`.
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as inputs; hash-verified by the toolchain on install):
#   golangci-lint v2.12.2, govulncheck v1.9.0 (-scan package),
#   gosec v2.30.0 (this repo's measured 1-triage baseline, see #13),
#   actionlint v1.7.12 (tarball, sha256-checked upstream).
name: ci

on:
  pull_request:
  push:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'manifest.yaml'
              - 'testdata/**'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
              - 'scripts/record-grants.sh'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
              - 'go.mod'
              - 'go.sum'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            misc:
              - '**'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!manifest.yaml'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!*.example.*'
              - '!scripts/record-grants.sh'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              - '!.github/dependabot.yml'
              - '!README.md'
              - '!LICENSE'

  go-ci:
    needs: [changes]
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions, so the run ceiling lives in the
    # upstream inner-lane timeouts.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: package-registry
      go-version-file: go.mod
      coverage-floor: 93.1
      run-image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' }}
      image-tag: eshu-collector-package-registry:ci
      image-context: .
      image-command: |
        set -euo pipefail
        seed="$RUNNER_TEMP/seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm --network none -v "$seed:/component" eshu-collector-package-registry:ci seed --dest /component
        test -x "$seed/collector"
        test -s "$seed/manifest.yaml"
        test -f .dockerignore
        test -z "$(grep -E '^FROM ' Dockerfile | grep -v '@sha256:')"
        grep -E -q 'image: .*@sha256:[0-9a-f]{64}' manifest.yaml
        test "$(awk '/^go / {print $2}' go.mod)" = "$(grep -E -o 'golang:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)"
      run-lint: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      run-test: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      run-race: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      run-shell: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true' }}
      run-boundary: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deps == 'true' }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so the failure()-gated issue job
      # below is reachable; PR runs stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      gosec-version: v2.30.0 # this repo's measured triaged baseline, see #13
      run-actionlint: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' }}

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. Fires only when go-ci failed on a schedule event.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only, and continue-on-error
    # so a 403 never turns into a silent green no-op. Skips when go-ci
    # failed: the finding count stays in that run's summary and the
    # weekly issue links the run.
    needs: [go-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-package-registry
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true
